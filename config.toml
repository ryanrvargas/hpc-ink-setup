# Inkly Global Configuration
#
# This file defines the runtime settings for Inkly.
# Runtime code should load and validate these values before use.
#
# Installation Policy
#
# Controls how Inkly is allowed to install and expose dependencies.
# These settings are designed for restricted HPC environments
# where users do not have sudo access.

[install]
# Restrict all installs to user-writable paths only.
# System-wide installs are never permitted.
user_space_only = true

# Allow Inkly to modify the user's shell rc file (e.g. ~/.bashrc)
# to register PATH updates or environment variables.
allow_modify_shell_rc = true

# Shell rc file that may be modified if allowed.
shell_rc = "~/.bashrc"

# Allow Inkly to inject user-space binaries into PATH.
# Disabling this requires users to manually manage PATH.
allow_path_injection = true

[state]
# Root directory for all Inkly-managed files.
inkly_home = "~/.inkly"

# Location for Inkly-managed launchers or executables.
bin_dir = "~/.inkly/bin"

# Root directory for all logs.
log_dir = "~/.inkly/logs"

# Logging & Research Controls
#
# Defines what data is logged and how it is retained.
# This section is critical for privacy and research ethics.
[logging]

# Enable or disable all logging.
enabled = true

# One of: debug, info, warning, error
level = "info"

# Schema version for log format compatibility.
schema_version = 1

# Log user prompts (sanitized by default).
log_user_prompts = true

# Log AI responses.
log_ai_responses = true
log_raw_ai_responses = false


# Log job success/failure outcomes.
log_job_outcomes = false

# EXPERIMENTAL / RESEARCH ONLY
# Raw prompts disabled by default for public release
log_raw_prompts = false

# Where logs are written.
# Paths are resolved via StateConfig at runtime.
per_user_logs = true
global_log = false

# Log rotation and size limits.
max_log_file_mb = 10
max_log_files = 5

# In-Memory History
#
# Controls how much conversational context is retained
# during a single Inkly session.
[logging.history]
enabled = true
max_prompts = 5

[intelligence]
enabled = true
min_jobs_required = 500
window_days = 90
auto_refresh = false

[conversation]
enabled = true
max_messages = 20
summarize = true
summary_trigger = 30
max_summary_chars = 1200

[core]
max_concurrent_requests = 4
max_prompt_length = 8000

[retrieval]
enabled = true
top_k = 3
fallback_to_all_plugins = true
min_score = 0.0
index_path = "~/.inkly/retrieval_index.json"

[llm]
model = "llama3-cuttlefish:latest"

[ollama]
# Supported modes:
# - admin_command: use the admin-managed Ollama command
# - direct_host: connect directly to a remote Ollama host
# - ssh_tunnel: connect through a local SSH tunnel
mode = "admin_command"
command_path = "/opt/ollama/ollama"
command_args = []
tunnel_enabled = false
ssh_target = ""
remote_host = "127.0.0.1"
remote_port = 11434
local_host = "127.0.0.1"
local_port = 11434
startup_timeout_sec = 30
manage_server = false
use_direct_host = false
direct_host = ""
direct_port = 11434