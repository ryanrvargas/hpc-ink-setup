# Inkly Global Configuration
#
# This file defines policy, not implementation.
# It declares what Inkly is allowed to do, not how it does it.
#
# Runtime code must treat this file as authoritative constraints.




# Installation Policy
#
# Controls how Inkly is allowed to install and expose dependencies.
# These settings are designed for restricted HPC environments
# where users do not have sudo access.

[install]
# Restrict all installs to user-writable paths only.
# System-wide installs are never permitted.
user_space_only = true

# Allow Inkly to modify the user's shell rc file (e.g. ~/.bashrc)
# to register PATH updates or environment variables.
allow_modify_shell_rc = true

# Shell rc file that may be modified if allowed.
shell_rc = "~/.bashrc"

# Allow Inkly to inject user-space binaries into PATH.
# Disabling this requires users to manually manage PATH.
allow_path_injection = true



# Network Assumptions
#
# Declares whether Inkly is allowed to access the network and,
# if so, which external domains are considered safe.
#
# This is policy only. Enforcement happens at runtime.
[network]

# If true, Inkly assumes outbound internet access is available.
# If false, network-dependent features should fail fast.
require_internet = true

# Explicit allowlist of domains Inkly is permitted to contact.
# This prevents accidental or unauthorized outbound traffic.
allowed_domains = [
  "github.com",
  "raw.githubusercontent.com",
  "registry.npmjs.org"
]


# Node / NVM Configuration
#
# Controls how Node.js is provisioned for Copilot CLI.
# Alias-based versions (lts, latest) are intentionally unsupported.

[node]
# Attempt to install Node.js if it is not already present.
install_if_missing = true

# Version of nvm used to manage Node installations.
nvm_version = "0.39.7"

# Explicit Node.js version required for Inkly.
# Must be a concrete version for reproducibility.
node_version = "20.11.1"

# Allow curl to be used during installation if available.
allow_curl = true

# Allow wget to be used during installation if available.
allow_wget = true


# Persistent State
#
# Defines where Inkly stores all persistent state.
# All paths are resolved and validated at runtime.
[state]

# Root directory for all Inkly-managed files.
inkly_home = "~/.inkly"

# Location for Inkly-managed binaries.
bin_dir = "~/.inkly/bin"

# Storage for Copilot configuration and session state.
copilot_config_dir = "~/.inkly/copilot"

# Root directory for all logs.
log_dir = "~/.inkly/logs"


# Copilot UI & Behavior
#
# Controls presentation and CLI behavior of Copilot.
# These settings affect usability, not safety.
[copilot.ui]

# Disable ANSI color output for compatibility with logs and terminals.
no_color = true

# UI theme preference.
theme = "plain"

# Copilot internal logging verbosity.
log_level = "none"

# Disable Copilot's usage footer in responses.
disable_usage_footer = true

# Copilot Guardrails (Tool-Level)
#
# Restricts how Copilot is allowed to invoke tools.
# These are hard safety limits.
[copilot.guardrails]

# Prevent Copilot from invoking multiple tools in parallel.
disable_parallel_tools = true

# Explicit denylist of shell commands that Copilot may never invoke.
# Wildcards are prefix-based.
deny_shell_commands = [
  "rm:*",
  "sudo:*",
  "chmod:*",
  "chown:*",
  "rmdir:*",
  "unlink:*",
  "cp:*",
  "mv:*"
]

# Prompt-Level Intent Filtering
#
# Filters user prompts before they reach Copilot.
# This is a second layer of defense beyond tool guardrails.
[prompt_filter]

# Enable prompt filtering.
enabled = true

# Treat keyword matching as case-insensitive.
case_insensitive = true

# Keywords that immediately block a prompt if detected.
blocked_keywords = [
  "rm",
  "mv",
  "unlink",
  "dd",
  "chmod",
  "chown",
  "rmdir",
  "sudo"
]

# Regular expressions for more precise blocking rules.
blocked_regex = [
  "cp\\s+-r"
]

# Output Sanitization
#
# Controls post-processing of Copilot output before display.
# This prevents leaking vendor metadata or irrelevant noise.
[output]

# Enable output sanitization.
sanitize = true

# Remove Copilot usage or telemetry blocks from output.
remove_usage_blocks = true

# Regex patterns for vendor-specific lines to remove.
remove_vendor_lines = [
  "^\\s*claude-.*Premium request\\"
]

# Wrapper Behavior
#
# Controls Inkly's CLI wrapper behavior and failure modes.
[wrapper]

# If true, show the full injected debug prompt before execution.
debug_prompt = true

# Allow interactive commands to pass through unmodified.
interactive_passthrough = true

# Require the user to be logged in before invoking Copilot.
require_login = false

# Fail immediately if Copilot CLI is not available.
fail_on_missing_copilot = true

# Logging & Research Controls
#
# Defines what data is logged and how it is retained.
# This section is critical for privacy and research ethics.
[logging]

# Enable or disable all logging.
enabled = true

# One of: debug, info, warning, error
level = "info"

# Schema version for log format compatibility.
schema_version = 1

# Log user prompts (sanitized by default).
log_user_prompts = true

# Log AI responses.
log_ai_responses = true
log_raw_ai_responses = false


# Log job success/failure outcomes.
log_job_outcomes = false

# EXPERIMENTAL / RESEARCH ONLY
# If enabled, raw user prompts are logged in plaintext.
# This may include sensitive research data.
# Default: disabled
log_raw_prompts = true

# Where logs are written.
# Paths are resolved via StateConfig at runtime.
per_user_logs = true
global_log = false

# Log rotation and size limits.
max_log_file_mb = 10
max_log_files = 5

# In-Memory History
#
# Controls how much conversational context is retained
# during a single Inkly session.
[logging.history]
enabled = true
max_prompts = 5

# Profile Support (Future)
#
# Placeholder for named configuration profiles.
[profile]
name = "default"
description = "Safe default Inkly configuration"
